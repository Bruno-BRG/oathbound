server {
  listen 80 default_server;
  listen 3000 default_server;  # Coolify Dockerfile apps default to port 3000
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # Code and shell: always check with the server (304 when unchanged).
  location = /            { add_header Cache-Control "no-cache" always; try_files /index.html =404; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location = /sw.js      { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; }
  location ^~ /js/ { add_header Cache-Control "no-cache" always; }
  location ^~ /css/ { add_header Cache-Control "no-cache" always; }

  # Big vendor bundle and images: cache for a week, still revalidated by ETag after that.
  location ^~ /assets/fonts/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location ^~ /assets/ { add_header Cache-Control "public, max-age=604800" always; }

  # Source books in PDF: served as real files, never the SPA fallback.
  location ^~ /output/pdf/ {
    default_type application/pdf;
    add_header Cache-Control "public, max-age=604800" always;
    add_header Content-Disposition "inline" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  location / { try_files $uri $uri/ /index.html; }
}
